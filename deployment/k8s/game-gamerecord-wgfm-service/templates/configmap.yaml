apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wgfm-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecord": {
        "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver",
        "GameInterfaceWGFmGamingBaseUrl": "http://game-gameinterface-wgfm-service:9090"
      },
      "GameRecordInfo": {
        "GameProviderCode": "WGFM",
        "GameProviderConfiguration": "WGFMConfiguration",
        "MinimumIntervalMinute": 1,
        "IntervalMinute": 3,
        "LockMinute": 1.5
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
