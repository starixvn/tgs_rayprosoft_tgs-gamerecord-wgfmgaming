apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-wgfm-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "WGFM",
        "GameProviderConfiguration": "WGFMConfiguration",
        "IntervalMinutes": 3,
        "IntervalMinutesMax": 1440,
        "IntervalMinutesMinimum": 1,
        "LockMinute": 2
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://ggame-gamecommand/",
        "GameInterfaceBaseUrl": "http://game-gameinterface-wgfm-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
